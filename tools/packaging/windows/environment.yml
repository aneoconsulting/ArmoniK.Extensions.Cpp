# Dependencies of the Windows MSVC build of the ArmoniK C++ SDK, from conda-forge.
# The ArmoniK.Api headers are generated with this exact protobuf, so applications
# built against the SDK zip must use the same versions.
name: armoniksdk
channels:
  - conda-forge
dependencies:
  - libgrpc=1.83.1
  - libprotobuf=7.35.1
  - libabseil=20260526.0
  - libre2-11=2025.11.05
  - c-ares=1.34.8
  - openssl=3.6.5
  - zlib=1.3.2
  - nlohmann_json=3.12.0
